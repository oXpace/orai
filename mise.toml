min_version = "2026.9.0"

# Orai 개발에 필요한 도구만 고정한다. Codex·Claude·QMD·CodeGraph는 사용자의 기존
# 설치를 쓰고 docs/compatibility.md에서 버전·capability를 관리한다.
[tools]
go = "1.27.1"

[settings]
lockfile = true
# 지원 대상: macOS arm64(검증 환경), Linux(코어·CI). Windows는 지원하지 않는다.
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]

[tasks.setup]
description = "Download Go module dependencies"
run = "go mod download"

[tasks.lint]
description = "Formatting and static checks"
run = ['test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)', "go vet ./..."]

[tasks.fmt]
description = "Apply gofmt"
run = "gofmt -w ."

[tasks.test]
description = "Unit, integration and end-to-end tests (race detector on)"
run = "go test -race ./..."

[tasks.build]
description = "Build ./dist/orai for this machine"
run = "go build -trimpath -o dist/orai ./cmd/orai"

[tasks.check]
description = "Everything CI runs"
depends = ["lint", "test"]

[tasks.doctor]
description = "Read-only diagnosis of this checkout as an Orai project"
run = "go run ./cmd/orai doctor"
