# Orai's own development project: docs search and code graph only.
# Resident roles are exercised in a separate pilot project (docs/operations.md), not here.
schema = 2
name = "orai"
session = "orai"

[integrations.shelf]
collections = { docs = "docs" }

[integrations.shelf.smoke]
lex = "nonce"
vec = "이전 실행이 남긴 낡은 hook이 세션 신원을 덮어쓰지 못하게 막는 방법"
expect = "docs/architecture.md"

[integrations.shelf.context]
"docs" = "Orai의 설계, 운영 절차, 호환성, 이력, 배포 문서. 문서마다 맡은 범위는 AGENTS.md의 문서 책임 표에 있다"

[integrations.codegraph]
smoke_symbol = "ValidateSaved"
