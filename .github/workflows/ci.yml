name: ci

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64 is the verified host; Linux covers the core (fcntl/POSIX).
        os: [macos-15, ubuntu-24.04]
        python: ["3.14.7", "3.11"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Real AMQ for the isolated queue integration test
        if: runner.os == 'macOS'
        run: brew install avivsinai/tap/amq
      - run: mise run lint
      - run: mise run test
      - run: mise run test:package
