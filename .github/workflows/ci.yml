name: ci

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64 is the verified host; Linux covers the core (fcntl/POSIX, inotify).
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Real AMQ for the mailbox interoperability test
        if: runner.os == 'macOS'
        run: brew install avivsinai/tap/amq
      - run: mise run lint
      - run: mise run test
      - name: Cross-build the release targets
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/orai
          done
