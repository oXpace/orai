[project]
name = "orai"
version = "0.1.0"
description = "Local launcher and diagnostics for role-based coding agent sessions over AMQ"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "oXpace", email = "the.ox@oxpace.io" }]
keywords = ["agents", "codex", "claude-code", "amq", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
orai = "orai.cli:main"

[project.urls]
Repository = "https://github.com/oXpace/orai"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not package", "--strict-markers"]
markers = ["package: builds and installs the wheel outside the checkout (slow)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
