# OpenSpec 프로젝트 설정. `orai setup`이 처음 한 번 만든 시작값이며, 프로젝트가 소유한다.
# Orai는 이 파일을 다시 쓰지 않는다. OpenSpec이 아래 context, rules, operations를 모든
# 워크플로(propose, apply, archive 등)의 지시에 넣는다. 항목: https://openspec.dev/docs/customize
schema: spec-driven

context: |
  이 프로젝트는 스펙 주도와 테스트 주도로 개발한다. 동작의 기준은 openspec/specs의
  요구와 시나리오이고, 구현은 그 시나리오를 확인하는 실패 테스트에서 시작한다.

rules:
  specs:
    - 시나리오의 WHEN/THEN은 테스트 하나로 확인할 수 있는 관찰 가능한 결과로 쓴다
  tasks:
    - 작업 묶음마다 그 묶음의 시나리오를 확인하는 테스트 작성을 첫 작업으로 둔다
    - 테스트와 문서 갱신을 마지막 묶음으로 미루지 않는다

operations:
  apply:
    guidance:
      - 시나리오마다 실패하는 테스트를 먼저 쓰고, 실행해서 실패하는 것을 확인한 뒤 구현한다
      - 테스트 이름이나 주석에 시나리오 이름을 남겨 스펙과 테스트가 서로 찾아지게 한다
      - 끝나면 프로젝트의 전체 검사를 실행하고, 시나리오별 테스트와 그 종류(fixture·fake, 실제 동작), 실행한 명령과 결과, 검증하지 못한 범위를 나눠 보고한다
  archive:
    guidance:
      - 모든 시나리오에 통과한 테스트가 있거나 검증하지 못한 사유가 적혀 있을 때만 보관한다
